[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofault-agent-demo"
version = "0.1.0"
description = "Safe synthetic automotive fault-testing agent demo"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
live = ["torch>=2.5", "transformers>=4.57,<5", "peft>=0.17,<1", "accelerate>=1.0,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autofault_agent = ["public_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
