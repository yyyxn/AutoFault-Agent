[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofault-agent-runtime-v2"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.10",
  "langgraph>=0.2",
  "openai>=1.0",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
tokenizer = ["transformers>=4.51"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
